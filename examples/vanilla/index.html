<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Powens Webview - Vanilla Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@powenscompany/webview-js"></script>
  <script type="module" src="app.js"></script>
</head>

<body>
  <main>
    <div class="card">
      <img class="logo" src="https://www.powens.com/wp-content/uploads/2024/09/powens_logo_Gradient-3.svg" alt="Powens">
      <h1>Connect your financial data</h1>
      <p class="subtitle">Link your bank account in a few simple steps using the Powens Webview.</p>
      <button id="open-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Connect your bank
      </button>
      <span class="badge">Vanilla JS</span>
    </div>

    <section id="json" hidden>
      <div class="result-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Webview response
      </div>
      <pre id="result"></pre>
    </section>
  </main>
  <powens-webview></powens-webview>
</body>

</html>
